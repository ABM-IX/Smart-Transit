name: smart_transit_app
description: "SmartTransit - Intelligent Cross-Platform Transit Ecosystem for iOS & Android"
publish_to: 'none'

version: 1.2.2+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  socket_io_client: ^3.0.2
  http: ^1.2.2
  provider: ^6.1.2
  geolocator: ^13.0.1
  google_fonts: ^6.2.1
  app_links: ^7.2.2
  intl: ^0.19.0
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.2.3
  rive: ^0.14.11
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/splash.riv
    - assets/animations/splash_dark.riv
    - assets/icon/
